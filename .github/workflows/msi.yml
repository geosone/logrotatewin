name: Windows MSI packages
on:
  push:
    branches: [master]
    tags: ['v*-msi.*']
    paths: ['New-WindowsMsi.ps1', 'powershell/**', 'packaging/**', 'tests/Test-WindowsMsi.ps1', '.github/workflows/msi.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install MSI compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends wixl git
      - name: Download pinned upstream input
        run: curl --fail --location --retry 3 https://github.com/geosone/logrotatewin/releases/download/v0.0.59-retain.1/logrotatewin-v0.0.59-retain.1-windows.zip -o "$RUNNER_TEMP/upstream.zip"
      - name: Build package and corresponding source
        shell: pwsh
        run: ./New-WindowsMsi.ps1 -ArchivePath "$env:RUNNER_TEMP/upstream.zip" -OutputDirectory "$env:RUNNER_TEMP/package" -Architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: logrotatewin-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/package/*.msi
            ${{ runner.temp }}/package/*.tar.gz
            ${{ runner.temp }}/package/SHA256SUMS
  lifecycle:
    needs: package
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: logrotatewin-${{ matrix.arch }}
          path: ${{ runner.temp }}/package
      - name: Install, repair, rotate and uninstall
        shell: pwsh
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'package'
          $package = Join-Path $directory 'logrotatewin-0.0.60-windows-${{ matrix.arch }}.msi'
          $line = Get-Content (Join-Path $directory 'SHA256SUMS') | Where-Object { $_ -match '\.msi$' }
          $hash = ($line -split '\s+')[0]
          ./tests/Test-WindowsMsi.ps1 -PackagePath $package -ExpectedSHA256 $hash -TestDirectory "$env:RUNNER_TEMP/msi-test" -Architecture '${{ matrix.arch }}'
      - name: Qualify upgrade from original MSI
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $old = Join-Path $env:RUNNER_TEMP 'old.msi'
          $url = "https://github.com/geosone/logrotatewin/releases/download/v0.0.59-msi.1/logrotatewin-0.0.59-windows-$arch.msi"
          Invoke-WebRequest $url -OutFile $old
          $expected = if ($arch -eq 'x86') { '1fecd4be9daf6043f5e9edd245aed8494b5597dd3de72f42e4000649ca87c9c3' } else { '8ec5dcfe2285d318af763eea963cde06a35757333c2ccb0730bf234bd1e03112' }
          if ((Get-FileHash $old).Hash -ine $expected) { throw 'Old fixture checksum mismatch.' }
          ./tests/Test-WindowsUpgrade.ps1 -OldPackage $old -NewPackage "$env:RUNNER_TEMP/package/logrotatewin-0.0.60-windows-$arch.msi" -Architecture $arch -TestDirectory "$env:RUNNER_TEMP/upgrade-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-${{ matrix.arch }}
          path: ${{ runner.temp }}/msi-test/*.log

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lifecycle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: logrotatewin-*
          path: packages
      - name: Combine qualified packages and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory release | Out-Null
          foreach ($file in Get-ChildItem packages -Recurse -File | Where-Object { $_.Extension -eq '.msi' -or $_.Name.EndsWith('.tar.gz') }) {
              $target = Join-Path ./release $file.Name
              if (Test-Path $target) {
                  if ((Get-FileHash $target).Hash -ne (Get-FileHash $file.FullName).Hash) { throw 'Source bundles differ.' }
              } else {
                  Copy-Item $file.FullName $target
              }
          }
          $lines = Get-ChildItem release -File | ForEach-Object { (Get-FileHash $_.FullName).Hash.ToLowerInvariant() + '  ' + $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/SHA256SUMS'), $lines)
          $files = Get-ChildItem release -File | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --repo $env:GITHUB_REPOSITORY --prerelease --title "LogRotateWin MSI 0.0.60" --notes 'Packages the qualified rotate -1 runtime. x86/x64 installation, repair, archive preservation, major upgrade from the original MSI and uninstall tested before publishing. Corresponding source and SHA256SUMS included. No automatic rotation schedule.'
          if ($LASTEXITCODE) { throw 'Release failed.' }
